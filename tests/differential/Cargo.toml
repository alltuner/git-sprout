[workspace]

[package]
name = "differential"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
description = "Differential test harness comparing git-sprout add against git worktree add"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
filetime = "0.2"
sha1 = "0.10"

[profile.release]
debug = true
