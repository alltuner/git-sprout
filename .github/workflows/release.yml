name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Rebuild/republish this tag (e.g. v0.1.0). Leave blank to defer to release-please."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# Serialize release runs so back-to-back releases queue instead of contending
# for the runner pool. cancel-in-progress stays false: an in-flight publish must
# never be cancelled, or a version gets skipped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # release-please prefixes every output with the package path when it is driven
      # by a manifest, even for a single package. The unprefixed names are always
      # empty, which silently skips every publishing job while still tagging the
      # release — an empty v0.1.0 was cut that way.
      release_created: ${{ steps.release.outputs['crates/git-sprout--release_created'] }}
      tag_name: ${{ steps.release.outputs['crates/git-sprout--tag_name'] }}
      version: ${{ steps.release.outputs['crates/git-sprout--version'] }}
    steps:
      - id: release
        if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve-tag:
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RP_CREATED: ${{ needs.release-please.outputs.release_created }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
            # The tag carries the component and reads `git-sprout-v0.1.0`, so
            # stripping a leading "v" leaves the whole tag behind and the formula
            # declares a version of the tag.
            VERSION="${DISPATCH_TAG##*-v}"
          elif [ "$RP_CREATED" = "true" ]; then
            TAG="$RP_TAG"
            VERSION="$RP_VERSION"

            # A release was cut and yet there is nothing to publish. That is the case
            # that ships a tagged release with no binaries, no crate and no formula
            # while reporting success, because every publishing job is guarded on
            # these outputs being non-empty and skipping is not failing. It happened
            # to v0.1.0 and it has to be loud.
            if [ -z "$TAG" ] || [ -z "$VERSION" ]; then
              echo "release-please created a release but resolved no tag." >&2
              echo "  created='${RP_CREATED}' tag='${RP_TAG}' version='${RP_VERSION}'" >&2
              echo "Its outputs are keyed by package path when driven by a manifest;" >&2
              echo "this workflow is probably reading the wrong names." >&2
              exit 1
            fi
          else
            # An ordinary commit that release-please did not turn into a release.
            # Nothing to publish and nothing wrong: the publishing jobs skip on the
            # empty outputs and the run stays green.
            echo "no release for this commit; nothing to publish"
            exit 0
          fi

          echo "publishing $TAG as version $VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish-crate:
    needs: [release-please, resolve-tag]
    if: needs.resolve-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Re-running a release must be safe. A version can only be published once, so a
      # dispatch that exists to regenerate a binary or a formula would otherwise fail
      # here and take the rest of the run with it.
      - name: Publish unless this version is already on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          published=$(curl -sS -H "User-Agent: git-sprout release workflow" \
            "https://crates.io/api/v1/crates/git-sprout/versions" \
            | python3 -c "import json,sys; print(' '.join(v['num'] for v in json.load(sys.stdin)['versions']))" \
            2>/dev/null || echo "")
          case " $published " in
            *" $VERSION "*)
              echo "git-sprout $VERSION is already on crates.io; nothing to publish."
              ;;
            *)
              cargo publish -p git-sprout
              ;;
          esac

  build-binaries:
    needs: [release-please, resolve-tag]
    if: needs.resolve-tag.outputs.tag != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: houseabsolute/actions-rust-cross@v1.0.8
        with:
          target: ${{ matrix.target }}
          args: --release --package git-sprout
          strip: true

      - name: Create archive (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../git-sprout-${{ matrix.target }}.tar.gz git-sprout git-worktree-fast

      - name: Create archive (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../git-sprout-${{ matrix.target }}.tar.gz git-sprout.exe git-worktree-fast.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: git-sprout-${{ matrix.target }}.tar.gz

  brew-formula:
    needs: [resolve-tag, build-binaries]
    if: needs.resolve-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "git-sprout-$target.tar.gz"
          done

      - name: Generate and push formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          MAC_ARM_SHA=$(sha256sum git-sprout-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          MAC_INTEL_SHA=$(sha256sum git-sprout-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          LINUX_ARM_SHA=$(sha256sum git-sprout-aarch64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          LINUX_INTEL_SHA=$(sha256sum git-sprout-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')

          BASE_URL="https://github.com/alltuner/git-sprout/releases/download/${TAG}"

          FORMULA_CONTENT=$(cat <<RUBY
          class GitSprout < Formula
            desc "Drop-in git worktree add that clones the tree instead of copying it"
            homepage "https://sprout.alltuner.com"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/git-sprout-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM_SHA}"
              else
                url "${BASE_URL}/git-sprout-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_INTEL_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/git-sprout-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              else
                url "${BASE_URL}/git-sprout-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_INTEL_SHA}"
              end
            end

            def install
              bin.install "git-sprout"
              bin.install "git-worktree-fast"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/git-sprout --version")
            end
          end
          RUBY
          )

          ENCODED=$(echo "$FORMULA_CONTENT" | base64 -w 0)
          EXISTING_SHA=$(gh api repos/alltuner/homebrew-tap/contents/Formula/git-sprout.rb -q '.sha' 2>/dev/null || true)

          if [ -n "$EXISTING_SHA" ]; then
            gh api repos/alltuner/homebrew-tap/contents/Formula/git-sprout.rb \
              --method PUT \
              -f message="git-sprout: update to v${VERSION}" \
              -f content="$ENCODED" \
              -f sha="$EXISTING_SHA"
          else
            gh api repos/alltuner/homebrew-tap/contents/Formula/git-sprout.rb \
              --method PUT \
              -f message="git-sprout: add formula at v${VERSION}" \
              -f content="$ENCODED"
          fi
